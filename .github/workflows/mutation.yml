name: mutation

# Weekly and on demand rather than on every push: it reruns the covering
# tests for hundreds of mutants, which takes about twenty minutes, and it
# measures how sharp the tests are rather than whether the code works.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    name: mutation testing

    # Scoped to Schema, Query and Security on purpose. Those read arbitrary
    # application code and decide what an agent may reach, so a surviving
    # mutant in one of them is a test watching the wrong thing. Mutating the
    # whole package would mostly measure how thoroughly plumbing is asserted.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov

      - run: composer update --prefer-dist --no-interaction

      - name: Mutation testing
        run: composer mutate
